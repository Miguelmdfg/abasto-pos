<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Pago Móvil — BodegaFlow</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/inventory.css" />

  <style>
    .pm-container {
      padding: 2rem;
    }

    .pm-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pm-table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(255,255,255,0.03);
      border-radius: 16px;
      overflow: hidden;
      margin-top: 1rem;
    }

    .pm-table th,
    .pm-table td {
      padding: 0.9rem;
      border-bottom: 1px solid rgba(148,163,184,0.1);
      font-size: 0.9rem;
    }

    .pm-table th {
      background: rgba(255,255,255,0.05);
      text-align: left;
    }

    .pm-filter {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
    }

    .pm-input {
      padding: 0.7rem 1rem;
      border-radius: 10px;
      border: 1px solid rgba(148,163,184,0.4);
      background: #0f172a;
      color: #e2e8f0;
      flex: 1;
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <header class="nav">
    <div class="nav-logo">BodegaFlow</div>

    <nav class="nav-links">
      <a href="pos.html">POS</a>
      <a href="inventory.html">Inventario</a>
      <a href="ventas.html">Ventas</a>
      <a href="pagomovil.html" class="active">Pago móvil</a>
      <a href="login.html">Login</a>
      <a href="deudas.html">Deudas</a>
    </nav>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <section class="pm-container">

    <div class="pm-header">
      <h1>Pago Móvil</h1>
    </div>

    <!-- FILTROS -->
    <div class="pm-filter">
      <input type="text" id="pmSearch" class="pm-input" placeholder="Buscar por referencia o banco..." />
      <input type="date" id="pmDate" class="pm-input" />
    </div>

    <!-- TABLA -->
    <table class="pm-table">
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Banco</th>
          <th>Referencia</th>
          <th>Monto</th>
          <th>Cliente</th>
        </tr>
      </thead>

      <tbody id="pmBody"></tbody>
    </table>

  </section>

  <script>
    // Datos simulados
    const pagos = [
      { fecha: "2026-02-01", banco: "Banesco", ref: "123456", monto: 50, cliente: "Carlos" },
      { fecha: "2026-02-02", banco: "Provincial", ref: "987654", monto: 120, cliente: "María" },
      { fecha: "2026-02-03", banco: "Mercantil", ref: "555222", monto: 80, cliente: "José" },
    ];

    const pmBody = document.getElementById("pmBody");
    const pmSearch = document.getElementById("pmSearch");
    const pmDate = document.getElementById("pmDate");

    function renderPagos(filterText = "", filterDate = "") {
      pmBody.innerHTML = "";

      pagos
        .filter(p => 
          (p.ref.includes(filterText) || p.banco.toLowerCase().includes(filterText.toLowerCase())) &&
          (filterDate ? p.fecha === filterDate : true)
        )
        .forEach(p => {
          const row = document.createElement("tr");

          row.innerHTML = `
            <td>${p.fecha}</td>
            <td>${p.banco}</td>
            <td>${p.ref}</td>
            <td>${p.monto} Bs</td>
            <td>${p.cliente}</td>
          `;

          pmBody.appendChild(row);
        });
    }

    renderPagos();

    pmSearch.addEventListener("input", () => {
      renderPagos(pmSearch.value, pmDate.value);
    });

    pmDate.addEventListener("change", () => {
      renderPagos(pmSearch.value, pmDate.value);
    });
  </script>

</body>
</html>
