<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio | Bodega Flow</title>
    <link rel="stylesheet" href="../css/global.css">
    <style>
        .home-container {
            max-width: 600px;
            margin: 40px auto;
            background: var(--background, #fff);
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .home-title {
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            color: var(--primary, #2c3e50);
        }
        .home-desc {
            font-size: 1.1rem;
            color: var(--text, #444);
            margin-bottom: 2rem;
            text-align: center;
        }
        .home-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            width: 100%;
        }
        .home-btn {
            background: var(--primary, #2c3e50);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 0.9rem 1.7rem;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 0.5rem;
        }
        .home-btn:hover {
            background: var(--accent, #2980b9);
        }
        @media (max-width: 600px) {
            .home-container {
                max-width: 98vw;
                padding: 1rem 0.5rem;
            }
            .home-title {
                font-size: 1.5rem;
            }
            .home-btn {
                width: 100%;
                padding: 1rem 0;
            }
        }
    </style>
</head>
<body>
    <div class="home-container">
        <div class="home-title">Bienvenido a Bodega Flow</div>
        <div class="home-desc">
            Sistema integral para la gestión de ventas, inventario, deudas y pagos en tu bodega. Optimiza tus procesos, lleva el control de tus productos y mejora la atención a tus clientes desde un solo lugar.
        </div>
        <div class="home-nav">
            <a href="pos.html"><button class="home-btn">Punto de Venta</button></a>
            <a href="ventas.html"><button class="home-btn">Ventas</button></a>
            <a href="deudas.html"><button class="home-btn">Deudas</button></a>
            <a href="inventory.html"><button class="home-btn">Inventario</button></a>
            <a href="pagomovil.html"><button class="home-btn">Pago Móvil</button></a>
            <a href="cierres-caja.html"><button class="home-btn">Cierres de Caja</button></a>
            <a href="login.html"><button class="home-btn">Cerrar Sesión</button></a>
        </div>
    </div>
</body>
</html>
