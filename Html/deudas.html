<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>BodegaFlow — Deudas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/deudas.css" />
</head>

<body>

  <header class="nav">
    <div class="nav-logo">BodegaFlow</div>

    <nav class="nav-links">
      <a href="index.html">Inicio</a>
      <a href="pos.html">POS</a>
      <a href="inventory.html">Inventario</a>
      <a href="ventas.html">Ventas</a>
      <a href="pagomovil.html">Pago móvil</a>
      <a href="deudas.html" class="active">Deudas</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <main class="deudas-container">
    <section class="panel clients-panel">
      <h2>Clientes con deuda</h2>

      <form id="client-form" class="form-inline">
        <input id="client-name" class="flex-grow" placeholder="Nombre" required />
        <input id="client-phone" placeholder="Teléfono" />
        <button type="submit">Agregar cliente</button>
      </form>

      <ul id="clients-list" class="clients-list"></ul>
    </section>

    <section class="panel detail-panel">
      <h2 id="detail-title">Selecciona un cliente</h2>

      <div id="client-detail" class="client-detail hidden">
        <div class="client-info">
          <div><strong id="detail-name"></strong></div>
          <div id="detail-phone" class="muted"></div>
        </div>

        <div class="products">
          <h3>Productos adeudados</h3>

          <form id="product-form" class="form-inline">
            <input id="product-name" class="flex-grow" placeholder="Producto" required />
            <input id="product-amount" placeholder="Monto (Bs)" required inputmode="numeric" />
            <button type="submit">Agregar</button>
          </form>

          <ul id="products-list" class="products-list"></ul>

          <div class="total-row">Total: <span id="total-amount">0</span> Bs</div>
        </div>
      </div>
    </section>
  </main>

  <script src="../js/deudas.js"></script>
</body>
</html>
