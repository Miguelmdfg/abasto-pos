<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Registro — BodegaFlow</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/auth.css" />
</head>

<body>

  <div class="auth-container">

    <div class="auth-card">

      <h2 class="auth-title">Crear cuenta</h2>

      <input 
        type="text" 
        id="regName" 
        class="auth-input" 
        placeholder="Nombre completo"
      />

      <input 
        type="email" 
        id="regEmail" 
        class="auth-input" 
        placeholder="Correo electrónico"
      />

      <input 
        type="password" 
        id="regPassword" 
        class="auth-input" 
        placeholder="Contraseña"
      />

      <button class="auth-btn" id="registerBtn">Registrarme</button>

      <p class="auth-footer">
        ¿Ya tienes cuenta?
        <a href="login.html">Iniciar sesión</a>
      </p>

    </div>

  </div>

  <script src="../js/auth.js"></script>
</body>
</html>
